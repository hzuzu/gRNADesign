# Conda environment for gRNADesign v1.2.0
#
#   mamba env create -f gRNADesign.yml      # or: conda env create -f gRNADesign.yml
#   conda activate gRNADesign
#
# Only direct dependencies are listed; conda resolves the rest. Versions are constrained
# to the range the release was tested against rather than to exact builds, so the
# environment stays installable on other machines while remaining reproducible.
name: gRNADesign
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.*
  # Bio.SeqIO only. Bio.Application (WaterCommandline) has been deprecated since
  # Biopython 1.83; the pipeline no longer uses it - water is invoked directly.
  - biopython>=1.85
  # Window scoring and all tabular output; numpy comes in as a dependency.
  # Capped below 3.0: pandas 3 changes the default string dtype and copy semantics, and
  # this release has not been validated against it.
  - pandas>=2.2,<3
  # RNAplfold (--fold_mode local) and RNAfold (--fold_mode global).
  - viennarna>=2.6,<2.7
  # water (Smith-Waterman) for the mismatch module. This was missing from the previous
  # environment file, so the mismatch step failed on a freshly created environment.
  - emboss>=6.6
